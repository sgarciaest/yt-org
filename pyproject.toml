[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "yt-org"
version = "0.1.0"
description = "Organize YouTube Watch Later into topic playlists"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "click>=8.0",
    "structlog>=24.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.scripts]
yt-org = "main:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
