youtube:
  client_secrets_file: client_secrets.json
  token_file: .token.json

classification:
  # model: intfloat/multilingual-e5-base # or `paraphrase-multilingual-MiniLM-L12-v2`
  model: paraphrase-multilingual-MiniLM-L12-v2

  fields:
    title: true
    tags: true
    channel: true
    description: true

  thresholds:
    move: 0.75
    review: 0.35

  top_n_alternatives: 3

channel_mapping:
  config_file: config/channel_topics.yaml
  # Added to the AI score for the matched topic when a channel mapping exists.
  # Set to 0.0 to disable without removing the mapping file.
  bonus: 0.5

playlists:
  # Videos with action: keep or review are added to WL/<fallback_name>.
  # All videos in the plan end up in some WL/* playlist after `apply`.
  fallback_name: general

